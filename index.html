<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Явка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding: 12px; display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto; }
    
    h2 { text-align: center; color: #2c3e50; font-size: 1.2rem; }
    
    .card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    
    label { font-size: 0.85rem; font-weight: 600; color: #666; display: block; margin-bottom: 4px; }
    
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: #3498db; }

    .selected-box { margin-top: 10px; background: #eef7fe; border: 1px solid #bce1fe; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; min-height: 42px; display: flex; align-items: center; justify-content: space-between; }
    
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .btn-full { grid-column: span 2; }

    button { padding: 12px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
    button:active { opacity: 0.8; }
    
    .btn-primary { background: #27ae60; color: white; }
    .btn-info { background: #2980b9; color: white; }
    .btn-warning { background: #e67e22; color: white; }
    .btn-secondary { background: #7f8c8d; color: white; }
    .btn-stat { background: #8e44ad; color: white; }

    textarea { width: 100%; height: 160px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; resize: none; margin-top: 6px; font-family: monospace; }

    .status { font-size: 0.8rem; text-align: center; color: #7f8c8d; min-height: 18px; }
  </style>
</head>
<body>

  <h2>Учет явки</h2>

  <div class="card">
    <label for="nameInput">Поиск из списка:</label>
    <input type="text" id="nameInput" list="namesList" placeholder="Введите имя или часть символов..." autocomplete="off">
    <datalist id="namesList"></datalist>

    <div class="selected-box" id="selectedBox">Выберите человека из списка</div>

    <button class="btn-primary btn-full" style="margin-top: 10px;" id="btnMark">Отметить</button>
  </div>

  <div class="card">
    <div class="btn-grid">
      <button class="btn-info" id="btnReport">Отчёт</button>
      <button class="btn-warning" id="btnAbsent">Отсутствующие</button>
      <button class="btn-secondary" id="btnCopy">Копировать</button>
      <button class="btn-stat" id="btnStats">Статистика</button>
    </div>
    
    <textarea id="outputArea" readonly placeholder="Результат действий выводится сюда..."></textarea>
  </div>

  <div class="status" id="statusText">Загрузка данных...</div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz2zd13zzwgizQCFJqM4QTplzmBvXY4YePrFzzJ0yFzlLEiUhz65xtHXpv4O1o3RafaBw/exec";

    let dbData = [];
    let selectedPerson = null;

    const nameInput = document.getElementById('nameInput');
    const namesList = document.getElementById('namesList');
    const selectedBox = document.getElementById('selectedBox');
    const outputArea = document.getElementById('outputArea');
    const statusText = document.getElementById('statusText');

    window.addEventListener('DOMContentLoaded', loadData);

    // Функция отправки запросов через JSONP (универсально для file:// и GitHub Pages)
    function sendJsonpRequest(params, callbackName) {
      const oldScript = document.getElementById('jsonp-req');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-req';
      
      const queryParams = new URLSearchParams(params);
      queryParams.append('callback', callbackName);
      
      script.src = `${GAS_URL}?${queryParams.toString()}`;
      script.onerror = () => {
        setStatus("Ошибка соединения с сервером");
      };

      document.body.appendChild(script);
    }

    // Загрузка списка
    function loadData() {
      setStatus("Обновление списка...");
      sendJsonpRequest({ action: 'getData' }, 'handleDataResponse');
    }

    window.handleDataResponse = function(data) {
      dbData = data;
      renderDropdown(nameInput.value);
      setStatus("Данные обновлены");
    };

    function setStatus(text) {
      statusText.textContent = text;
    }

    // Рендер выпадающего списка
    function renderDropdown(filterQuery = "") {
      namesList.innerHTML = '';
      const query = filterQuery.trim().toLowerCase();
      
      const availablePersons = dbData.filter(item => {
        const isNotPresent = String(item.is) !== "1";
        const matchesQuery = query === "" || String(item.name).toLowerCase().includes(query);
        return isNotPresent && matchesQuery;
      });

      availablePersons.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.name;
        namesList.appendChild(opt);
      });
    }

    // Обработка ввода
    nameInput.addEventListener('input', () => {
      const val = nameInput.value;
      renderDropdown(val);

      const found = dbData.find(item => item.name === val && String(item.is) !== "1");
      if (found) {
        selectedPerson = found;
        selectedBox.textContent = `ID: ${found.id} | ${found.name}`;
      } else {
        selectedPerson = null;
        selectedBox.textContent = "Выберите человека из списка";
      }
    });

    // Нажатие кнопки "Отметить"
    document.getElementById('btnMark').addEventListener('click', () => {
      if (!selectedPerson) {
        alert("Сначала выберите человека из списка!");
        return;
      }

      const personToMark = selectedPerson;
      setStatus("Сохранение отметки в Google Таблицу...");

      // Отправляем GET-запрос на регистрацию отметки
      sendJsonpRequest({ action: 'mark', id: personToMark.id }, 'handleMarkResponse');

      // Выводим отмеченного человека в нижнее поле вывода
      outputArea.value = `Отмечен: ID ${personToMark.id}. ${personToMark.name}`;

      // Локальное обновление состояния UI
      personToMark.is = 1;
      nameInput.value = '';
      selectedPerson = null;
      selectedBox.textContent = "Успешно отмечено!";
      renderDropdown();
    });

    window.handleMarkResponse = function(response) {
      if (response && response.status === "success") {
        setStatus("Отметка успешно записана в таблицу");
        // Синхронизируем свежие данные через 1 секунду
        setTimeout(loadData, 1000);
      }
    };

    // Отчёт
    document.getElementById('btnReport').addEventListener('click', () => {
      setStatus("Формирование отчета...");
      const toReport = dbData.filter(item => String(item.is) === "1" && String(item.report) !== "1");
      
      if (toReport.length === 0) {
        outputArea.value = "Нет новых записей для отчета.";
      } else {
        outputArea.value = toReport.map(item => `${item.id}. ${item.name}`).join('\n');
        // Отправляем команду на запись report = 1
        sendJsonpRequest({ action: 'makeReport' }, 'handleReportResponse');
      }
    });

    window.handleReportResponse = function(response) {
      if (response && response.status === "success") {
        setStatus("Отчет сформирован и сохранен в таблице");
        setTimeout(loadData, 1000);
      }
    };

    // Отсутствующие
    document.getElementById('btnAbsent').addEventListener('click', () => {
      const absent = dbData.filter(item => String(item.is) !== "1");
      if (absent.length === 0) {
        outputArea.value = "Отсутствующих нет (все присутствуют).";
      } else {
        outputArea.value = absent.map(item => `${item.id}. ${item.name}`).join('\n');
      }
      setStatus("Выведен список отсутствующих");
    });

    // Копировать
    document.getElementById('btnCopy').addEventListener('click', () => {
      if (!outputArea.value) {
        alert("Поле вывода пустое!");
        return;
      }
      outputArea.select();
      navigator.clipboard.writeText(outputArea.value).then(() => {
        setStatus("Скопировано в буфер обмена!");
      }).catch(() => {
        document.execCommand('copy');
        setStatus("Скопировано!");
      });
    });

    // Статистика
    document.getElementById('btnStats').addEventListener('click', () => {
      const total = dbData.length || 140;
      const presentCount = dbData.filter(item => String(item.is) === "1").length;
      const percent = ((presentCount / total) * 100).toFixed(1);

      outputArea.value = `--- СТАТИСТИКА ---\n` +
                         `Всего в списке: ${total}\n` +
                         `Присутствуют (is=1): ${presentCount}\n` +
                         `Процент явки: ${percent}%`;
      setStatus("Статистика рассчитана");
    });
  </script>
</body>
</html>
